
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Connection Test</title>
</head>
<body>

    <h2>Firebase Connection Test</h2>

    <form id="login-form">
        <label>Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" id="password" required>

        <br><br>

        <button type="submit">Login and Test Firestore</button>
    </form>

    <h3 id="result">Waiting for login...</h3>

    <script src="backend/firebase-config.js"></script>
    <script src="backend/firestore-api.js"></script>
    <script src="backend/auth-api.js"></script>
    <script src="backend/utility.js"></script>
    <script src="backend/user-api.js"></script>
    <script src="backend/auth-service.js"></script>
    <script src="backend/category-api.js"></script>

    <script>
        document.getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const result =
                    document.getElementById("result");

                try {
                    result.textContent = "Signing in...";

                    await loginUserAccount(email, password);

                    result.textContent =
                        "Login successful! Testing Firestore...";

                    const categories = await getCategories();

                    result.textContent =
                        "SUCCESS! JavaScript connected to Firebase. " +
                        "Categories found: " +
                        (categories.documents || []).length;

                } catch (error) {
                    console.error(error);

                    result.textContent =
                        "ERROR: " +
                        (error.message || JSON.stringify(error));
                }
            });
    </script>

</body>
</html>
