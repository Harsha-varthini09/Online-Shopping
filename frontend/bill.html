<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bill | Elegance Store</title>

    <script>
        if (!sessionStorage.getItem("firebaseIdToken")) {
            window.location.replace("login.html");
        }
    </script>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .bill-actions {
            width: min(92%, 820px);
            margin: 30px auto 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bill {
            width: min(92%, 820px);
            margin: 20px auto 50px;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            padding: 40px;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--lavender-light);
            padding-bottom: 20px;
            margin-bottom: 22px;
        }

        .bill-header .logo {
            font-size: 30px;
        }

        .bill-meta {
            text-align: right;
            font-size: 14px;
        }

        .bill-meta h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .bill-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .bill-parties h4 {
            font-family: var(--font-body);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .bill-parties p {
            color: var(--text);
        }

        .bill-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .bill-table th,
        .bill-table td {
            padding: 11px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .bill-table th {
            background: var(--cream);
            color: var(--plum);
        }

        .bill-table .num {
            text-align: right;
            white-space: nowrap;
        }

        .bill-total td {
            font-size: 18px;
            font-weight: 700;
            color: var(--plum);
            border-bottom: none;
        }

        .bill-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
        }

        .bill-message {
            text-align: center;
            padding: 40px 0;
        }

        @media print {

            body {
                background: white;
            }

            .bill-actions {
                display: none;
            }

            .bill {
                box-shadow: none;
                margin: 0 auto;
                width: 100%;
                padding: 0;
            }
        }

        @media (max-width: 600px) {

            .bill {
                padding: 22px;
            }

            .bill-parties {
                grid-template-columns: 1fr;
            }

            .bill-meta {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="bill-actions">
        <a href="my-orders.html" class="btn btn-outline" id="back-link">← Back to Orders</a>
        <button type="button" class="btn" id="print-bill" disabled>Print Bill</button>
    </div>

    <main class="bill" id="bill">
        <p class="bill-message">Loading bill...</p>
    </main>

    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/order-api.js"></script>

    <script>
    (async function () {

        const bill = document.getElementById("bill");

        const isAdmin = sessionStorage.getItem("userRole") === "admin";

        if (isAdmin) {
            const back = document.getElementById("back-link");
            back.href = "admin-orders.html";
            back.textContent = "← Back to All Orders";
        }

        function money(value) {
            return "₹" + Number(value || 0).toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function element(tag, text, className) {
            const node = document.createElement(tag);
            if (text !== undefined) node.textContent = text;
            if (className) node.className = className;
            return node;
        }

        function showMessage(text) {
            bill.innerHTML = "";
            bill.appendChild(element("p", text, "bill-message"));
        }

        const orderId = new URLSearchParams(window.location.search).get("id");

        if (!orderId) {
            showMessage("No order selected.");
            return;
        }

        let order;

        try {

            const document = await getOrderById(orderId);

            order = convertFromFirestoreDocument(document);

            order.order_id = order.order_id || orderId;

            if (!(order.created_at instanceof Date) && document.createTime) {
                order.created_at = new Date(document.createTime);
            }

        } catch (error) {

            console.error("Bill Error:", error);

            showMessage(error.status === 404 || error.status === 403
                ? "This bill could not be found."
                : "Unable to load the bill. Please try again.");
            return;
        }

        // A CUSTOMER MAY ONLY SEE THEIR OWN BILL

        if (!isAdmin && order.user_id !== sessionStorage.getItem("firebaseUserId")) {
            showMessage("This bill could not be found.");
            return;
        }

        const paymentLabel = String(order.payment_method).toLowerCase() === "credit"
            ? "Store Credit"
            : "Cash on Delivery";

        bill.innerHTML = "";

        // HEADER

        const header = element("div", undefined, "bill-header");

        const brand = element("div");
        brand.appendChild(element("div", "Elegance.", "logo"));
        brand.appendChild(element("p", "Online Shopping"));

        const meta = element("div", undefined, "bill-meta");
        meta.appendChild(element("h2", "Invoice / Bill"));
        meta.appendChild(element("p", "Bill No: " + order.order_id));
        meta.appendChild(element("p", "Date: " + (order.created_at instanceof Date
            ? order.created_at.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })
            : "-")));
        meta.appendChild(element("p", "Status: " + (order.order_status || "pending")));

        header.appendChild(brand);
        header.appendChild(meta);
        bill.appendChild(header);

        // CUSTOMER + PAYMENT

        const parties = element("div", undefined, "bill-parties");

        const billTo = element("div");
        billTo.appendChild(element("h4", "Bill To"));
        billTo.appendChild(element("p", order.customer_name || "-"));
        if (order.customer_email) billTo.appendChild(element("p", order.customer_email));
        billTo.appendChild(element("p", "Phone: " + (order.phone || "-")));
        billTo.appendChild(element("p", [order.shipping_address, order.city, order.pincode].filter(Boolean).join(", ")));

        const payment = element("div");
        payment.appendChild(element("h4", "Payment"));
        payment.appendChild(element("p", "Method: " + paymentLabel));
        payment.appendChild(element("p", "Payment Status: " + (order.payment_status || "pending")));

        parties.appendChild(billTo);
        parties.appendChild(payment);
        bill.appendChild(parties);

        // ITEMS

        const table = element("table", undefined, "bill-table");

        const head = element("thead");
        const headRow = element("tr");
        [["#", ""], ["Product", ""], ["Price", "num"], ["Qty", "num"], ["Amount", "num"]].forEach(function (col) {
            headRow.appendChild(element("th", col[0], col[1]));
        });
        head.appendChild(headRow);
        table.appendChild(head);

        const body = element("tbody");

        let itemsTotal = 0;

        (order.items || []).forEach(function (item, index) {

            const amount = Number(item.price || 0) * Number(item.quantity || 0);

            itemsTotal += amount;

            const row = element("tr");
            row.appendChild(element("td", String(index + 1)));
            row.appendChild(element("td", item.title || item.product_id));
            row.appendChild(element("td", money(item.price), "num"));
            row.appendChild(element("td", String(item.quantity), "num"));
            row.appendChild(element("td", money(amount), "num"));
            body.appendChild(row);
        });

        const totalRow = element("tr", undefined, "bill-total");
        const label = element("td", "Grand Total");
        label.colSpan = 4;
        totalRow.appendChild(label);
        totalRow.appendChild(element("td", money(order.total_amount ?? itemsTotal), "num"));
        body.appendChild(totalRow);

        table.appendChild(body);
        bill.appendChild(table);

        bill.appendChild(element("p", "Thank you for shopping with Elegance Store!", "bill-footer"));

        document.title = "Bill " + order.order_id + " | Elegance Store";

        const printButton = document.getElementById("print-bill");
        printButton.disabled = false;
        printButton.addEventListener("click", function () { window.print(); });

    })();
    </script>

</body>

</html>
