
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Online Shopping</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #FFF9F2;
            color: #4B4352;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .cart-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .cart-title {
            text-align: center;
            color: #493B59;
            margin-bottom: 30px;
        }

        .cart-card {
            background: #FFFFFF;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(73, 59, 89, 0.08);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
            border-bottom: 1px solid #EAE1ED;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-thumb {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background: #EDE5F7;
            flex-shrink: 0;
        }

        .stock-note {
            color: #a00000;
            font-size: 13px;
            margin-top: 6px;
        }

        .quantity-controls button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .cart-item h3 {
            color: #493B59;
            margin: 0 0 8px;
        }

        .cart-price {
            color: #C77D91;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity-controls button {
            background: #B8A4D9;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn {
            background: #C77D91 !important;
        }

        .cart-summary {
            margin-top: 25px;
            text-align: right;
        }

        .cart-summary h2 {
            color: #493B59;
        }

        .cart-buttons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .cart-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .continue-btn {
            background: #F2C6D0;
            color: #493B59;
        }

        .checkout-btn {
            background: #B8A4D9;
            color: white;
            font-weight: bold;
        }

        .clear-btn {
            background: #C77D91;
            color: white;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 15px;
            color: #8C8492;
        }

        .empty-cart h2 {
            color: #493B59;
        }

        .cart-message {
            margin-top: 15px;
            color: #a00000;
        }

        @media (max-width: 650px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-buttons {
                flex-direction: column;
            }

            .cart-btn {
                width: 100%;
                box-sizing: border-box;
            }

            .cart-summary {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Elegance.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="my-orders.html">My Orders</a></li>
            <li><a href="login.html" id="auth-link">Login</a></li>
        </ul>
    </nav>
    <!-- CART SECTION -->
    <main class="cart-container">

        <h1 class="cart-title">My Shopping Cart</h1>

        <div class="cart-card">

            <div id="cart-items">
                Loading cart items...
            </div>

            <div id="cart-summary" class="cart-summary"
                style="display: none;">

                <h2>
                    Total: ₹<span id="cart-total">0.00</span>
                </h2>

            </div>

            <div class="cart-buttons">

                <a href="products.html"
                    class="cart-btn continue-btn">
                    Continue Shopping
                </a>

                <button type="button"
                    class="cart-btn clear-btn"
                    id="clear-cart-btn"
                    onclick="clearCart()">
                    Clear Cart
                </button>

                <button type="button"
                    class="cart-btn checkout-btn"
                    id="checkout-btn"
                    onclick="proceedToCheckout()">
                    Proceed to Checkout
                </button>

            </div>

            <p id="cart-message" class="cart-message"></p>

        </div>

    </main>

    <!-- BACKEND FILES -->
    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/cart-api.js"></script>
    <script src="../Backend/product-api.js"></script>
    <script src="js/product-image.js"></script>

    <!-- CART JAVASCRIPT -->
    <script>

        let cartItems = [];

        const userId =
            sessionStorage.getItem("firebaseUserId");

        const token =
            sessionStorage.getItem("firebaseIdToken");


        // CHECK LOGIN
        if (!userId || !token) {

            window.location.replace("login.html");

        }


        // LOAD CART
        async function loadCartPage() {

            try {

                const response = await getCart(userId);

                const cartData =
                    convertFromFirestoreDocument(response);

                cartItems = cartData.items || [];

                await loadStock();

                displayCartItems();

            } catch (error) {

                console.error("Cart Loading Error:", error);

                if (error.error?.status === "NOT_FOUND") {

                    cartItems = [];
                    displayCartItems();

                } else {

                    document.getElementById("cart-items")
                        .textContent =
                        "Unable to load your cart. Please try again.";

                }

            }

        }


        // LATEST STOCK / STATUS FOR EACH CART ITEM
        let stockInfo = {};

        async function loadStock() {

            const documents = await Promise.all(
                cartItems.map(function (item) {
                    return getProductById(item.product_id).catch(function () {
                        return null;
                    });
                })
            );

            stockInfo = {};

            cartItems.forEach(function (item, index) {

                const product = documents[index]
                    ? convertFromFirestoreDocument(documents[index])
                    : null;

                stockInfo[item.product_id] = product;
            });
        }


        // DISPLAY CART ITEMS
        function displayCartItems() {

            const container =
                document.getElementById("cart-items");

            const summary =
                document.getElementById("cart-summary");

            const checkoutButton =
                document.getElementById("checkout-btn");

            const clearButton =
                document.getElementById("clear-cart-btn");

            container.innerHTML = "";

            if (cartItems.length === 0) {

                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your Cart is Empty</h2>
                        <p>Add products to your cart to continue shopping.</p>
                    </div>
                `;

                summary.style.display = "none";
                checkoutButton.disabled = true;
                checkoutButton.style.opacity = "0.5";
                clearButton.disabled = true;

                return;

            }

            checkoutButton.disabled = false;
            checkoutButton.style.opacity = "1";
            clearButton.disabled = false;

            let total = 0;

            cartItems.forEach(function (item, index) {

                const price = Number(item.price);
                const quantity = Number(item.quantity);

                const subtotal = price * quantity;

                total += subtotal;

                const itemDiv =
                    document.createElement("div");

                itemDiv.className = "cart-item";

                const product = stockInfo[item.product_id];

                const stock = product ? Number(product.qty || 0) : 0;

                const unavailable = !product || product.status !== "active";

                const thumb = document.createElement("img");

                thumb.className = "cart-thumb";

                setProductImage(
                    thumb,
                    Object.assign({ id: item.product_id }, product || {}, { title: item.title }),
                    ""
                );

                thumb.alt = item.title;

                itemDiv.appendChild(thumb);

                const details =
                    document.createElement("div");

                details.className = "cart-item-details";

                const title =
                    document.createElement("h3");

                title.textContent = item.title;

                const priceText =
                    document.createElement("p");

                priceText.className = "cart-price";

                priceText.textContent =
                    "Price: ₹" + price.toFixed(2);

                const subtotalText =
                    document.createElement("p");

                subtotalText.textContent =
                    "Subtotal: ₹" + subtotal.toFixed(2);

                const controls =
                    document.createElement("div");

                controls.className = "quantity-controls";

                const decreaseButton =
                    document.createElement("button");

                decreaseButton.textContent = "-";

                decreaseButton.onclick = function () {
                    updateQuantity(index, -1);
                };

                const quantityText =
                    document.createElement("span");

                quantityText.textContent = quantity;

                const increaseButton =
                    document.createElement("button");

                increaseButton.textContent = "+";

                increaseButton.onclick = function () {
                    updateQuantity(index, 1);
                };

                increaseButton.disabled = unavailable || quantity >= stock;

                increaseButton.title = increaseButton.disabled
                    ? "No more stock available"
                    : "Add one more";

                const removeButton =
                    document.createElement("button");

                removeButton.textContent = "Remove";

                removeButton.className = "remove-btn";

                removeButton.onclick = function () {
                    removeItem(index);
                };

                controls.appendChild(decreaseButton);
                controls.appendChild(quantityText);
                controls.appendChild(increaseButton);
                controls.appendChild(removeButton);

                details.appendChild(title);
                details.appendChild(priceText);
                details.appendChild(subtotalText);
                details.appendChild(controls);

                if (unavailable || quantity > stock) {

                    const note = document.createElement("p");

                    note.className = "stock-note";

                    note.textContent = unavailable
                        ? "This product is no longer available. Please remove it."
                        : "Only " + stock + " left in stock. Please reduce the quantity.";

                    details.appendChild(note);
                }

                itemDiv.appendChild(details);

                container.appendChild(itemDiv);

            });

            document.getElementById("cart-total")
                .textContent = total.toFixed(2);

            summary.style.display = "block";

        }


        // UPDATE QUANTITY
        async function updateQuantity(index, change) {

            const newQuantity =
                cartItems[index].quantity + change;

            const product = stockInfo[cartItems[index].product_id];

            if (change > 0 && product && newQuantity > Number(product.qty || 0)) {

                document.getElementById("cart-message").textContent =
                    "Only " + Number(product.qty || 0) + " of this item in stock.";

                return;
            }

            if (newQuantity <= 0) {

                removeItem(index);
                return;

            }

            cartItems[index].quantity = newQuantity;

            await updateCartInFirebase();

        }


        // REMOVE ITEM
        async function removeItem(index) {

            cartItems.splice(index, 1);

            await updateCartInFirebase();

        }


        // CLEAR CART
        async function clearCart() {

            if (!confirm("Are you sure you want to clear your cart?")) {
                return;
            }

            cartItems = [];

            await updateCartInFirebase();

        }


        // SAVE CART CHANGES
        async function updateCartInFirebase() {

            try {

                await saveCart(userId, cartItems);

                displayCartItems();

                document.getElementById("cart-message")
                    .textContent = "";

            } catch (error) {

                console.error("Cart Update Error:", error);

                document.getElementById("cart-message")
                    .textContent =
                    "Unable to update cart. Please try again.";

            }

        }


        // PROCEED TO CHECKOUT
        function proceedToCheckout() {

            if (cartItems.length === 0) {

                alert("Your cart is empty. Add products first.");

                return;

            }

            window.location.href = "checkout.html";

        }


        // START CART PAGE
        loadCartPage();

    </script>

    <!-- AUTH NAVIGATION -->
    <script src="js/auth-navigation.js"></script>

</body>

</html>
