
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Online Shopping</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #FFF9F2;
            color: #4B4352;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .checkout-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .checkout-title {
            text-align: center;
            color: #493B59;
            margin-bottom: 30px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .checkout-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(73, 59, 89, 0.08);
            margin-bottom: 20px;
        }

        .checkout-card h2 {
            color: #493B59;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #EAE1ED;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .payment-option {
            background: #FFF9F2;
            padding: 15px;
            border: 1px solid #F2C6D0;
            border-radius: 10px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #EAE1ED;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #493B59;
            margin-top: 20px;
        }

        .place-order-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #B8A4D9;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .place-order-btn:hover {
            background: #9279B8;
        }

        .place-order-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error-message {
            background: #ffe4e4;
            color: #a00000;
        }

        .success-message {
            background: #e4f7e8;
            color: #17652a;
        }

        @media (max-width: 750px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="checkout-container">

        <h1 class="checkout-title">Complete Your Order</h1>

        <div class="checkout-layout">

            <!-- DELIVERY DETAILS -->
            <section>

                <div class="checkout-card">

                    <h2>Delivery Details</h2>

                    <form id="checkout-form">

                        <div class="form-group">
                            <label for="customer-name">Full Name</label>
                            <input type="text" id="customer-name"
                                placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-phone">Phone Number</label>
                            <input type="tel" id="customer-phone"
                                placeholder="Enter your phone number"
                                pattern="[0-9]{10}" maxlength="10" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-address">Delivery Address</label>
                            <textarea id="customer-address"
                                placeholder="Enter your complete delivery address"
                                required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="customer-city">City</label>
                            <input type="text" id="customer-city"
                                placeholder="Enter your city" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-pincode">PIN Code</label>
                            <input type="text" id="customer-pincode"
                                placeholder="Enter 6-digit PIN code"
                                pattern="[0-9]{6}" maxlength="6" required>
                        </div>

                    </form>

                </div>

                <!-- PAYMENT METHOD -->
                <div class="checkout-card">

                    <h2>Payment Method</h2>

                    <div class="payment-option">
                        <label>
                            <input type="radio" name="payment-method"
                                value="cash" checked disabled>
                            <strong>Cash on Delivery</strong>
                        </label>

                        <p>Pay with cash when your order is delivered.</p>
                    </div>

                </div>

            </section>

            <!-- ORDER SUMMARY -->
            <section>

                <div class="checkout-card">

                    <h2>Order Summary</h2>

                    <div id="order-items">
                        Loading cart items...
                    </div>

                    <div class="order-total">
                        <span>Total Amount</span>
                        <span id="order-total">₹0.00</span>
                    </div>

                    <button type="submit" form="checkout-form"
                        class="place-order-btn" id="place-order-btn">
                        Place Order
                    </button>

                    <div id="checkout-message" class="message"></div>

                </div>

            </section>

        </div>

    </main>

    <!-- BACKEND FILES -->
    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/cart-api.js"></script>
    <script src="../Backend/order-api.js"></script>
    <script src="../Backend/payment-api.js"></script>

    <script>

        let currentCartItems = [];
        let currentTotal = 0;

        const userId = sessionStorage.getItem("firebaseUserId");
        const token = sessionStorage.getItem("firebaseIdToken");

        // CHECK LOGIN
        if (!userId || !token) {
            window.location.replace("login.html");
        }

        // DISPLAY MESSAGE
        function showMessage(message, type) {

            const messageBox =
                document.getElementById("checkout-message");

            messageBox.textContent = message;
            messageBox.className = "message " + type;
            messageBox.style.display = "block";
        }

        // LOAD CART ITEMS
        async function loadCheckoutItems() {

            try {

                const response = await getCart(userId);

                const cartData =
                    convertFromFirestoreDocument(response);

                currentCartItems = cartData.items || [];

                if (currentCartItems.length === 0) {

                    document.getElementById("order-items").textContent =
                        "Your cart is empty.";

                    document.getElementById("place-order-btn").disabled =
                        true;

                    return;
                }

                displayCheckoutItems();

            } catch (error) {

                console.error("Checkout Cart Error:", error);

                document.getElementById("order-items").textContent =
                    "Unable to load your cart.";

                document.getElementById("place-order-btn").disabled =
                    true;
            }
        }

        // DISPLAY ORDER SUMMARY
        function displayCheckoutItems() {

            const container =
                document.getElementById("order-items");

            container.innerHTML = "";

            currentTotal = 0;

            currentCartItems.forEach(function (item) {

                const price = Number(item.price);
                const quantity = Number(item.quantity);

                const subtotal = price * quantity;

                currentTotal += subtotal;

                const itemDiv = document.createElement("div");
                itemDiv.className = "order-item";

                const itemName = document.createElement("span");
                itemName.textContent =
                    item.title + " × " + quantity;

                const itemPrice = document.createElement("strong");
                itemPrice.textContent =
                    "₹" + subtotal.toFixed(2);

                itemDiv.appendChild(itemName);
                itemDiv.appendChild(itemPrice);

                container.appendChild(itemDiv);

            });

            document.getElementById("order-total").textContent =
                "₹" + currentTotal.toFixed(2);
        }

        // PLACE ORDER
        document.getElementById("checkout-form")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const button =
                    document.getElementById("place-order-btn");

                if (currentCartItems.length === 0) {
                    showMessage(
                        "Your cart is empty.",
                        "error-message"
                    );
                    return;
                }

                const customerName =
                    document.getElementById("customer-name").value.trim();

                const phone =
                    document.getElementById("customer-phone").value.trim();

                const address =
                    document.getElementById("customer-address").value.trim();

                const city =
                    document.getElementById("customer-city").value.trim();

                const pincode =
                    document.getElementById("customer-pincode").value.trim();

                if (currentTotal <= 0) {
                    showMessage(
                        "Invalid order amount.",
                        "error-message"
                    );
                    return;
                }

                button.disabled = true;
                button.textContent = "Placing Order...";

                try {

                    // PREPARE CASH PAYMENT
                    const paymentDetails =
                        preparePaymentDetails(currentTotal, "cash");

                    // GENERATE ORDER ID
                    const orderId =
                        "ORD" + Date.now();

                    // CREATE ORDER DATA
                    const orderData = {

                        order_id: orderId,

                        user_id: userId,

                        customer_name: customerName,

                        phone: phone,

                        shipping_address: address,

                        city: city,

                        pincode: pincode,

                        items: currentCartItems,

                        total_amount: currentTotal,

                        payment_method: paymentDetails.payment_method,

                        payment_status: paymentDetails.payment_status,

                        order_status: "pending",

                        created_at: new Date()

                    };

                    // SAVE ORDER TO FIREBASE
                    await createOrder(orderData);

                    // CLEAR CART AFTER SUCCESSFUL ORDER
                    await saveCart(userId, []);

                    showMessage(
                        "Order placed successfully! Your Order ID is " +
                        orderId,
                        "success-message"
                    );

                    document.getElementById("order-items").textContent =
                        "Your order has been placed successfully.";

                    document.getElementById("order-total").textContent =
                        "₹0.00";

                    document.getElementById("checkout-form").reset();

                    button.textContent = "Order Placed";

                } catch (error) {

                    console.error("Place Order Error:", error);

                    showMessage(
                        "Unable to place your order. Please check the console for details.",
                        "error-message"
                    );

                    button.disabled = false;
                    button.textContent = "Place Order";

                }

            });

        // START CHECKOUT
        loadCheckoutItems();

    </script>

</body>
</html>
