
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Online Shopping</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #FFF9F2;
            color: #4B4352;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .checkout-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .checkout-title {
            text-align: center;
            color: #493B59;
            margin-bottom: 30px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .checkout-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(73, 59, 89, 0.08);
            margin-bottom: 20px;
        }

        .checkout-card h2 {
            color: #493B59;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #EAE1ED;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .payment-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #FFF9F2;
            padding: 15px;
            border: 1px solid #EAE1ED;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .payment-option:has(input:checked) {
            border-color: #C77D91;
            background: #FDF3F6;
        }

        .payment-option.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .payment-option input {
            margin-top: 5px;
            accent-color: #C77D91;
        }

        .payment-option small {
            display: block;
            color: #8C8492;
            font-size: 13px;
        }

        .credit-bar {
            height: 6px;
            background: #EAE1ED;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
        }

        .credit-bar span {
            display: block;
            height: 100%;
            background: #C77D91;
        }

        .stock-warning {
            display: block;
            color: #a00000;
            font-size: 13px;
        }

        .success-message a {
            color: #17652a;
            font-weight: bold;
            text-decoration: underline;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #EAE1ED;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #493B59;
            margin-top: 20px;
        }

        .place-order-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #B8A4D9;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .place-order-btn:hover {
            background: #9279B8;
        }

        .place-order-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error-message {
            background: #ffe4e4;
            color: #a00000;
        }

        .success-message {
            background: #e4f7e8;
            color: #17652a;
        }

        @media (max-width: 750px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Elegance.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="my-orders.html">My Orders</a></li>
            <li><a href="login.html" id="auth-link">Login</a></li>
        </ul>
    </nav>

    <main class="checkout-container">

        <h1 class="checkout-title">Complete Your Order</h1>

        <div class="checkout-layout">

            <!-- DELIVERY DETAILS -->
            <section>

                <div class="checkout-card">

                    <h2>Delivery Details</h2>

                    <form id="checkout-form">

                        <div class="form-group">
                            <label for="customer-name">Full Name</label>
                            <input type="text" id="customer-name"
                                placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-phone">Phone Number</label>
                            <input type="tel" id="customer-phone"
                                placeholder="Enter your phone number"
                                pattern="[0-9]{10}" maxlength="10" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-address">Delivery Address</label>
                            <textarea id="customer-address"
                                placeholder="Enter your complete delivery address"
                                required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="customer-city">City</label>
                            <input type="text" id="customer-city"
                                placeholder="Enter your city" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-pincode">PIN Code</label>
                            <input type="text" id="customer-pincode"
                                placeholder="Enter 6-digit PIN code"
                                pattern="[0-9]{6}" maxlength="6" required>
                        </div>

                    </form>

                </div>

                <!-- PAYMENT METHOD -->
                <div class="checkout-card">

                    <h2>Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="cash" checked>
                        <span>
                            <strong>Cash on Delivery</strong>
                            <small>Pay with cash when your order is delivered.</small>
                        </span>
                    </label>

                    <label class="payment-option" id="credit-option">
                        <input type="radio" name="payment-method" value="credit" id="credit-radio">
                        <span>
                            <strong>Store Credit</strong>
                            <small id="credit-info">Checking your credit limit...</small>
                        </span>
                    </label>

                </div>

            </section>

            <!-- ORDER SUMMARY -->
            <section>

                <div class="checkout-card">

                    <h2>Order Summary</h2>

                    <div id="order-items">
                        Loading cart items...
                    </div>

                    <div class="order-total">
                        <span>Total Amount</span>
                        <span id="order-total">₹0.00</span>
                    </div>

                    <button type="submit" form="checkout-form"
                        class="place-order-btn" id="place-order-btn">
                        Place Order
                    </button>

                    <div id="checkout-message" class="message"></div>

                </div>

            </section>

        </div>

    </main>

    <!-- BACKEND FILES -->
    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/product-api.js"></script>
    <script src="../Backend/cart-api.js"></script>
    <script src="../Backend/payment-api.js"></script>
    <script src="../Backend/customer-api.js"></script>
    <script src="../Backend/mail-api.js"></script>
    <script src="../Backend/order-api.js"></script>

    <script>

        let currentCartItems = [];
        let currentTotal = 0;
        let availableCredit = 0;
        let stockProblem = false;

        const userId = sessionStorage.getItem("firebaseUserId");
        const token = sessionStorage.getItem("firebaseIdToken");
        const userEmail = sessionStorage.getItem("firebaseEmail") || "";

        // CHECK LOGIN
        if (!userId || !token) {
            window.location.replace("login.html");
        }

        const placeButton = document.getElementById("place-order-btn");
        const creditRadio = document.getElementById("credit-radio");
        const creditInfo = document.getElementById("credit-info");

        // DISPLAY MESSAGE
        function showMessage(message, type, link) {

            const messageBox =
                document.getElementById("checkout-message");

            messageBox.textContent = message;

            if (link) {
                messageBox.appendChild(document.createTextNode(" "));
                const anchor = document.createElement("a");
                anchor.href = link.href;
                anchor.textContent = link.text;
                messageBox.appendChild(anchor);
            }

            messageBox.className = "message " + type;
            messageBox.style.display = "block";
        }

        function money(value) {
            return "₹" + Number(value || 0).toFixed(2);
        }

        // LOAD CART ITEMS (WITH LATEST PRICE AND STOCK)
        async function loadCheckoutItems() {

            try {

                const response = await getCart(userId);

                const cartData =
                    convertFromFirestoreDocument(response);

                currentCartItems = cartData.items || [];

                if (currentCartItems.length === 0) {
                    showEmptyCart();
                    return;
                }

                const productDocuments = await Promise.all(
                    currentCartItems.map(function (item) {
                        return getProductById(item.product_id).catch(function () {
                            return null;
                        });
                    })
                );

                currentCartItems.forEach(function (item, index) {

                    const document = productDocuments[index];
                    const product = document ? convertFromFirestoreDocument(document) : null;

                    item.problem = "";

                    if (!product || product.status !== "active") {
                        item.problem = "No longer available - please remove it from your cart.";
                    } else {
                        item.price = Number(product.price);
                        if (Number(product.qty || 0) < Number(item.quantity)) {
                            item.problem = "Only " + Number(product.qty || 0) + " left in stock - please update your cart.";
                        }
                    }
                });

                displayCheckoutItems();

            } catch (error) {

                console.error("Checkout Cart Error:", error);

                if (error.status === 404) {
                    showEmptyCart();
                    return;
                }

                document.getElementById("order-items").textContent =
                    "Unable to load your cart.";

                placeButton.disabled = true;
            }
        }

        function showEmptyCart() {

            const box = document.getElementById("order-items");

            box.textContent = "Your cart is empty. ";

            const link = document.createElement("a");
            link.href = "products.html";
            link.textContent = "Continue shopping";
            box.appendChild(link);

            placeButton.disabled = true;
        }

        // DISPLAY ORDER SUMMARY
        function displayCheckoutItems() {

            const container =
                document.getElementById("order-items");

            container.innerHTML = "";

            currentTotal = 0;
            stockProblem = false;

            currentCartItems.forEach(function (item) {

                const price = Number(item.price);
                const quantity = Number(item.quantity);

                const subtotal = price * quantity;

                currentTotal += subtotal;

                const itemDiv = document.createElement("div");
                itemDiv.className = "order-item";

                const itemName = document.createElement("span");
                itemName.textContent =
                    item.title + " × " + quantity;

                if (item.problem) {
                    stockProblem = true;
                    const warning = document.createElement("small");
                    warning.className = "stock-warning";
                    warning.textContent = item.problem;
                    itemName.appendChild(warning);
                }

                const itemPrice = document.createElement("strong");
                itemPrice.textContent = money(subtotal);

                itemDiv.appendChild(itemName);
                itemDiv.appendChild(itemPrice);

                container.appendChild(itemDiv);

            });

            currentTotal = Math.round(currentTotal * 100) / 100;

            document.getElementById("order-total").textContent =
                money(currentTotal);

            const messageBox = document.getElementById("checkout-message");

            if (stockProblem) {
                showMessage("Some items need attention.", "error-message", { href: "cart.html", text: "Go to cart" });
                messageBox.dataset.stock = "1";
            } else if (messageBox.dataset.stock) {
                // PROBLEM FIXED - CLEAR THE OLD WARNING
                messageBox.style.display = "none";
                delete messageBox.dataset.stock;
            }

            placeButton.disabled = stockProblem;

            updateCreditOption();
        }

        // LOAD CUSTOMER PROFILE (PREFILL + CREDIT)
        async function loadCustomerProfile() {

            try {

                const result = await getOrCreateCustomerProfile(userId, userEmail);

                const profile = result.profile;

                availableCredit = Math.max(0, Math.round((profile.credit_limit - profile.credit_used) * 100) / 100);

                const nameInput = document.getElementById("customer-name");
                const phoneInput = document.getElementById("customer-phone");

                if (!nameInput.value && profile.name) nameInput.value = profile.name;
                if (!phoneInput.value && profile.mob) phoneInput.value = profile.mob;

                creditInfo.dataset.limit = profile.credit_limit;
                creditInfo.dataset.used = profile.credit_used;

            } catch (error) {

                console.error("Customer Profile Error:", error);

                availableCredit = 0;
                creditInfo.dataset.error = "1";
            }

            updateCreditOption();
        }

        function updateCreditOption() {

            const option = document.getElementById("credit-option");

            if (creditInfo.dataset.error) {
                creditRadio.disabled = true;
                option.classList.add("disabled");
                creditInfo.textContent = "Store credit is unavailable right now.";
                return;
            }

            if (creditInfo.dataset.limit === undefined) {
                return;
            }

            const limit = Number(creditInfo.dataset.limit);
            const used = Number(creditInfo.dataset.used);

            const enough = currentTotal > 0 && currentTotal <= availableCredit;

            creditInfo.textContent =
                "Available credit: " + money(availableCredit) +
                " of " + money(limit) +
                (enough || currentTotal === 0 ? "" : " - not enough for this order.");

            let bar = option.querySelector(".credit-bar");

            if (!bar) {
                bar = document.createElement("div");
                bar.className = "credit-bar";
                bar.appendChild(document.createElement("span"));
                creditInfo.after(bar);
            }

            bar.firstChild.style.width = (limit > 0 ? Math.min(100, used / limit * 100) : 100) + "%";

            creditRadio.disabled = !enough;
            option.classList.toggle("disabled", !enough);

            if (!enough && creditRadio.checked) {
                document.querySelector('input[name="payment-method"][value="cash"]').checked = true;
            }
        }

        // FORM VALIDATION
        function validateDelivery(details) {

            if (!/^[A-Za-z][A-Za-z .'-]{1,59}$/.test(details.customer_name)) {
                return "Please enter a valid full name (letters only).";
            }

            if (!/^[6-9][0-9]{9}$/.test(details.phone)) {
                return "Phone number must be 10 digits and start with 6, 7, 8 or 9.";
            }

            if (details.shipping_address.length < 10) {
                return "Please enter your complete delivery address (at least 10 characters).";
            }

            if (!/^[A-Za-z][A-Za-z .-]{1,49}$/.test(details.city)) {
                return "Please enter a valid city name.";
            }

            if (!/^[1-9][0-9]{5}$/.test(details.pincode)) {
                return "PIN code must be 6 digits and cannot start with 0.";
            }

            return "";
        }

        // PLACE ORDER
        document.getElementById("checkout-form")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                if (currentCartItems.length === 0) {
                    showMessage("Your cart is empty.", "error-message");
                    return;
                }

                if (stockProblem) {
                    showMessage("Some items need attention.", "error-message", { href: "cart.html", text: "Go to cart" });
                    return;
                }

                const details = {
                    customer_name: document.getElementById("customer-name").value.trim(),
                    phone: document.getElementById("customer-phone").value.trim(),
                    shipping_address: document.getElementById("customer-address").value.trim(),
                    city: document.getElementById("customer-city").value.trim(),
                    pincode: document.getElementById("customer-pincode").value.trim()
                };

                const problem = validateDelivery(details);

                if (problem) {
                    showMessage(problem, "error-message");
                    return;
                }

                const paymentMethod =
                    document.querySelector('input[name="payment-method"]:checked').value;

                placeButton.disabled = true;
                placeButton.textContent = "Placing Order...";

                try {

                    const order = await placeOrder(
                        userId,
                        userEmail,
                        currentCartItems,
                        details,
                        paymentMethod
                    );

                    showMessage(
                        "Order placed successfully! Your Order ID is " + order.order_id +
                        ". A confirmation email is on its way.",
                        "success-message",
                        { href: "bill.html?id=" + encodeURIComponent(order.order_id), text: "View / print your bill" }
                    );

                    currentCartItems = [];

                    document.getElementById("order-items").textContent =
                        "Your order has been placed successfully.";

                    document.getElementById("order-total").textContent =
                        money(order.total_amount);

                    document.getElementById("checkout-form").reset();

                    placeButton.textContent = "Order Placed";

                    if (paymentMethod === "credit") {
                        loadCustomerProfile();
                    }

                } catch (error) {

                    console.error("Place Order Error:", error);

                    let message = error.message || "";

                    if (error.status === 403) {
                        console.error(
                            "[Store setup] Firestore rejected the order (PERMISSION_DENIED). " +
                            "Placing an order updates orders, products (stock), carts and Customers (credit). " +
                            "Publish the rules in firestore.rules: Firebase Console -> Firestore Database -> Rules -> Publish.",
                            error.error
                        );
                        message = "Your order could not be saved (permission denied).";

                        if (error.diagnosis && error.diagnosis.length) {
                            console.error("[Store setup] Diagnosis:\n- " + error.diagnosis.join("\n- "));
                            message += " Reason: " + error.diagnosis.join(" ");
                        } else {
                            message += " Please contact the store.";
                        }
                    } else if (error.status) {
                        message = "Unable to place your order. Please try again.";
                    }

                    showMessage(message || "Unable to place your order. Please try again.", "error-message");

                    placeButton.disabled = false;
                    placeButton.textContent = "Place Order";

                    // REFRESH PRICES / STOCK / CREDIT
                    loadCheckoutItems();
                    loadCustomerProfile();
                }

            });

        // START CHECKOUT
        loadCheckoutItems();
        loadCustomerProfile();

    </script>

    <script src="js/auth-navigation.js"></script>

</body>
</html>
