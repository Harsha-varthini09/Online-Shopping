<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Orders | Elegance Admin</title>

    <script>
        // ADMIN ONLY PAGE

        if (!sessionStorage.getItem("firebaseIdToken")) {
            window.location.replace("login.html");
        } else if (sessionStorage.getItem("userRole") !== "admin") {
            window.location.replace("index.html");
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

    <style>
        .admin-banner {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(135deg, #EDE5F7, #F2C6D0);
        }

        .admin-banner p {
            margin-top: 8px;
        }

        .admin-section {
            padding: 40px 0 75px;
        }

        /* SUMMARY CARDS */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .stat-card span {
            display: block;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card strong {
            display: block;
            margin-top: 6px;
            font-family: var(--font-heading);
            font-size: 28px;
            color: var(--plum);
        }

        .stat-split {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        /* TOOLBAR */

        .orders-toolbar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .orders-toolbar .search-box {
            flex: 1;
            min-width: 220px;
        }

        .orders-toolbar select {
            width: 170px;
        }

        .result-count {
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* ORDER CARDS */

        .order-card {
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            overflow: hidden;
        }

        .order-summary {
            display: grid;
            grid-template-columns: 1.6fr 1.3fr 1fr 1fr auto;
            align-items: center;
            gap: 15px;
            padding: 18px 22px;
            cursor: pointer;
            width: 100%;
            background: none;
            border: none;
            text-align: left;
        }

        .order-summary:hover {
            background: #FDFBFE;
        }

        .order-summary small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .order-id {
            font-weight: 700;
            color: var(--plum);
            word-break: break-all;
        }

        .order-amount {
            font-weight: 700;
            color: var(--rose);
            font-size: 17px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: capitalize;
            background: var(--lavender-light);
            color: var(--plum);
        }

        .status-pending { background: #FCEBD6; color: #8A5A1F; }
        .status-processing,
        .status-confirmed { background: #E3ECFB; color: #2F5596; }
        .status-shipped { background: #EDE5F7; color: #5B3F86; }
        .status-delivered,
        .status-paid,
        .status-completed { background: #DDF1E6; color: #2F6B4F; }
        .status-cancelled,
        .status-failed { background: #F9DDE1; color: #9A3442; }

        .toggle-icon {
            font-size: 18px;
            color: var(--muted);
            transition: transform 0.25s;
        }

        .order-card.open .toggle-icon {
            transform: rotate(180deg);
        }

        .order-body {
            display: none;
            padding: 0 22px 22px;
            border-top: 1px solid var(--border);
        }

        .order-card.open .order-body {
            display: block;
        }

        .order-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 18px 0;
        }

        .order-info-grid span {
            display: block;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-info-grid p {
            color: var(--text);
            word-break: break-word;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .items-table th,
        .items-table td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .items-table th {
            background: var(--cream);
            color: var(--plum);
        }

        .items-table td:last-child,
        .items-table th:last-child {
            text-align: right;
        }

        .empty-orders {
            text-align: center;
            background: white;
            padding: 45px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .order-summary {
                grid-template-columns: 1fr 1fr;
            }

            .order-info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 550px) {

            .stats-grid,
            .order-info-grid {
                grid-template-columns: 1fr;
            }

            .orders-toolbar select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav class="navbar">
        <a href="admin.html" class="logo">Elegance. <span class="admin-tag">Admin</span></a>
        <ul class="nav-links">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="admin-products.html">Inventory</a></li>
            <li><a href="admin-categories.html">Categories</a></li>
            <li><a href="admin-customers.html">Customers</a></li>
            <li><a href="admin-orders.html">Orders</a></li>
            <li><a href="admin-reports.html">Reports</a></li>
            <li><a href="index.html">Store</a></li>
            <li><a href="login.html" id="auth-link">Logout</a></li>
        </ul>
    </nav>


    <!-- BANNER -->

    <section class="admin-banner">

        <h1>All Orders</h1>

        <p>Track every order placed in the store.</p>

    </section>


    <section class="admin-section">

        <div class="container">

            <!-- SUMMARY -->

            <div class="stats-grid">

                <div class="stat-card">
                    <span>Total Orders</span>
                    <strong id="stat-orders">0</strong>
                </div>

                <div class="stat-card">
                    <span>Total Revenue</span>
                    <strong id="stat-revenue">₹0</strong>
                    <small id="stat-split" class="stat-split"></small>
                </div>

                <div class="stat-card">
                    <span>Pending Orders</span>
                    <strong id="stat-pending">0</strong>
                </div>

                <div class="stat-card">
                    <span>Customers</span>
                    <strong id="stat-customers">0</strong>
                </div>

            </div>


            <!-- SEARCH / FILTER / SORT -->

            <div class="orders-toolbar">

                <input
                    type="search"
                    id="order-search"
                    class="form-control search-box"
                    placeholder="Search by order ID, customer, phone or city..."
                >

                <select id="status-filter" class="form-control">
                    <option value="">All Statuses</option>
                </select>

                <select id="payment-filter" class="form-control">
                    <option value="">All Payments</option>
                    <option value="cash">Cash</option>
                    <option value="credit">Credit</option>
                </select>

                <select id="order-sort" class="form-control">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="high">Amount: High to Low</option>
                    <option value="low">Amount: Low to High</option>
                </select>

                <button type="button" class="btn btn-outline" id="refresh-orders">
                    Refresh
                </button>

            </div>

            <p class="result-count" id="result-count"></p>

            <div id="orders-list">

                <div class="empty-orders">
                    <h3>Loading orders...</h3>
                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Elegance Store. All Rights Reserved.
        </p>

    </footer>


    <!-- BACKEND FILES -->

    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/order-api.js"></script>
    <script src="js/auth-navigation.js"></script>
    <script src="js/admin-common.js"></script>

    <script>
    (function () {

        let allOrders = [];

        const ordersList = document.getElementById("orders-list");
        const searchInput = document.getElementById("order-search");
        const statusFilter = document.getElementById("status-filter");
        const sortSelect = document.getElementById("order-sort");
        const paymentFilter = document.getElementById("payment-filter");
        const resultCount = document.getElementById("result-count");
        const refreshButton = document.getElementById("refresh-orders");


        // =============================================
        // HELPERS
        // =============================================

        function formatMoney(value) {
            return "₹" + Number(value || 0).toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(value) {

            if (!(value instanceof Date) || isNaN(value)) {
                return "-";
            }

            return value.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function getStatus(order) {
            return String(order.order_status || "pending").toLowerCase();
        }

        function getPayment(order) {
            return String(order.payment_method || "cash").toLowerCase();
        }

        function getPaymentLabel(order) {
            const method = getPayment(order);
            return method.charAt(0).toUpperCase() + method.slice(1);
        }

        function getTime(order) {
            return order.created_at instanceof Date
                ? order.created_at.getTime()
                : 0;
        }

        function showMessage(title, text) {

            ordersList.innerHTML = "";

            const box = document.createElement("div");

            box.className = "empty-orders";

            const heading = document.createElement("h3");

            heading.textContent = title;

            box.appendChild(heading);

            if (text) {
                const paragraph = document.createElement("p");
                paragraph.textContent = text;
                box.appendChild(paragraph);
            }

            ordersList.appendChild(box);
        }


        // =============================================
        // LOAD ALL ORDERS (ALL PAGES)
        // =============================================

        async function loadAllOrders() {

            showMessage("Loading orders...");

            resultCount.textContent = "";

            try {

                const orders = [];

                let pageToken = null;

                do {

                    const response = await getAllOrders(pageToken);

                    (response.documents || []).forEach(function (document) {

                        const order = convertFromFirestoreDocument(document);

                        if (!order.order_id) {
                            order.order_id = document.name.split("/").pop();
                        }

                        if (!(order.created_at instanceof Date) && document.createTime) {
                            order.created_at = new Date(document.createTime);
                        }

                        orders.push(order);
                    });

                    pageToken = response.nextPageToken || null;

                } while (pageToken);

                allOrders = orders;

                updateStats();
                loadStatusOptions();
                renderOrders();

            } catch (error) {

                console.error("Admin Orders Error:", error);

                const denied = error && error.status === 403;

                showMessage(
                    "Unable to load orders",
                    denied
                        ? "Permission denied. Make sure your Firestore rules allow admins to read the orders collection."
                        : "Please refresh the page or log in again."
                );
            }
        }


        // =============================================
        // SUMMARY STATS
        // =============================================

        function updateStats() {

            const validOrders = allOrders.filter(function (order) {
                return getStatus(order) !== "cancelled";
            });

            function sumOf(orders) {
                return orders.reduce(function (sum, order) {
                    return sum + Number(order.total_amount || 0);
                }, 0);
            }

            const revenue = sumOf(validOrders);

            const cashRevenue = sumOf(validOrders.filter(function (order) {
                return getPayment(order) === "cash";
            }));

            const creditRevenue = sumOf(validOrders.filter(function (order) {
                return getPayment(order) === "credit";
            }));

            document.getElementById("stat-split").textContent =
                "Cash " + formatMoney(cashRevenue) +
                " · Credit " + formatMoney(creditRevenue);

            const pending = allOrders.filter(function (order) {
                return getStatus(order) === "pending";
            }).length;

            const customers = new Set(
                allOrders.map(function (order) {
                    return order.user_id;
                }).filter(Boolean)
            ).size;

            document.getElementById("stat-orders").textContent = allOrders.length;
            document.getElementById("stat-revenue").textContent = formatMoney(revenue);
            document.getElementById("stat-pending").textContent = pending;
            document.getElementById("stat-customers").textContent = customers;
        }


        // =============================================
        // STATUS FILTER OPTIONS (FROM REAL DATA)
        // =============================================

        function loadStatusOptions() {

            const selected = statusFilter.value;

            const statuses = Array.from(
                new Set(allOrders.map(getStatus))
            ).sort();

            statusFilter.innerHTML = '<option value="">All Statuses</option>';

            statuses.forEach(function (status) {

                const option = document.createElement("option");

                option.value = status;

                option.textContent =
                    status.charAt(0).toUpperCase() + status.slice(1);

                statusFilter.appendChild(option);
            });

            statusFilter.value = statuses.includes(selected) ? selected : "";
        }


        // =============================================
        // FILTER, SORT AND DISPLAY
        // =============================================

        function renderOrders() {

            const searchText = searchInput.value.toLowerCase().trim();

            const status = statusFilter.value;

            const payment = paymentFilter.value;

            let orders = allOrders.filter(function (order) {

                if (status && getStatus(order) !== status) {
                    return false;
                }

                if (payment && getPayment(order) !== payment) {
                    return false;
                }

                if (!searchText) {
                    return true;
                }

                return [
                    order.order_id,
                    order.customer_name,
                    order.phone,
                    order.city,
                    order.pincode,
                    order.user_id
                ].some(function (value) {
                    return String(value || "").toLowerCase().includes(searchText);
                });
            });

            const sort = sortSelect.value;

            orders.sort(function (a, b) {

                if (sort === "oldest") return getTime(a) - getTime(b);
                if (sort === "high") return Number(b.total_amount || 0) - Number(a.total_amount || 0);
                if (sort === "low") return Number(a.total_amount || 0) - Number(b.total_amount || 0);

                return getTime(b) - getTime(a);
            });

            resultCount.textContent =
                "Showing " + orders.length + " of " + allOrders.length + " orders";

            if (orders.length === 0) {

                showMessage(
                    "No Orders Found",
                    allOrders.length === 0
                        ? "No orders have been placed yet."
                        : "Try a different search or status filter."
                );

                return;
            }

            ordersList.innerHTML = "";

            orders.forEach(function (order) {
                ordersList.appendChild(createOrderCard(order));
            });
        }


        // =============================================
        // ORDER CARD
        // =============================================

        function createOrderCard(order) {

            const card = document.createElement("div");

            card.className = "order-card";

            // SUMMARY ROW (CLICK TO EXPAND)

            const summary = document.createElement("button");

            summary.type = "button";

            summary.className = "order-summary";

            summary.setAttribute("aria-expanded", "false");

            function addColumn(mainText, smallText, className) {

                const column = document.createElement("div");

                const main = document.createElement("div");

                main.textContent = mainText;

                if (className) {
                    main.className = className;
                }

                column.appendChild(main);

                if (smallText) {
                    const small = document.createElement("small");
                    small.textContent = smallText;
                    column.appendChild(small);
                }

                summary.appendChild(column);
            }

            addColumn(order.order_id, formatDate(order.created_at), "order-id");

            addColumn(order.customer_name || "-", order.phone || "");

            const itemCount = (order.items || []).reduce(function (sum, item) {
                return sum + Number(item.quantity || 0);
            }, 0);

            addColumn(
                formatMoney(order.total_amount),
                itemCount + (itemCount === 1 ? " item" : " items") +
                    " · " + getPaymentLabel(order),
                "order-amount"
            );

            const statusColumn = document.createElement("div");

            const badge = document.createElement("span");

            const status = getStatus(order);

            badge.className =
                "status-badge status-" + status.replace(/[^a-z]/g, "");

            badge.textContent = status;

            statusColumn.appendChild(badge);

            summary.appendChild(statusColumn);

            const toggle = document.createElement("span");

            toggle.className = "toggle-icon";

            toggle.textContent = "▾";

            summary.appendChild(toggle);

            summary.addEventListener("click", function () {

                const open = card.classList.toggle("open");

                summary.setAttribute("aria-expanded", String(open));
            });

            // DETAILS

            const body = document.createElement("div");

            body.className = "order-body";

            const infoGrid = document.createElement("div");

            infoGrid.className = "order-info-grid";

            function addInfo(label, value) {

                const block = document.createElement("div");

                const name = document.createElement("span");

                name.textContent = label;

                const data = document.createElement("p");

                data.textContent = value || "-";

                block.appendChild(name);
                block.appendChild(data);

                infoGrid.appendChild(block);
            }

            addInfo("Customer", order.customer_name);
            addInfo("Phone", order.phone);
            addInfo("Customer ID", order.user_id);
            addInfo(
                "Delivery Address",
                [order.shipping_address, order.city, order.pincode]
                    .filter(Boolean)
                    .join(", ")
            );
            addInfo("Payment Method", getPaymentLabel(order));
            addInfo("Payment Status", order.payment_status || "Pending");

            body.appendChild(infoGrid);

            // ITEMS TABLE

            const table = document.createElement("table");

            table.className = "items-table";

            table.innerHTML =
                "<thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>";

            const tbody = document.createElement("tbody");

            (order.items || []).forEach(function (item) {

                const row = document.createElement("tr");

                [
                    item.title || item.product_id || "Product",
                    formatMoney(item.price),
                    item.quantity || 0,
                    formatMoney(Number(item.price || 0) * Number(item.quantity || 0))
                ].forEach(function (value) {

                    const cell = document.createElement("td");

                    cell.textContent = value;

                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            const totalRow = document.createElement("tr");

            const totalLabel = document.createElement("th");

            totalLabel.colSpan = 3;

            totalLabel.textContent = "Total";

            const totalValue = document.createElement("th");

            totalValue.textContent = formatMoney(order.total_amount);

            totalRow.appendChild(totalLabel);
            totalRow.appendChild(totalValue);

            tbody.appendChild(totalRow);

            table.appendChild(tbody);

            body.appendChild(table);

            const billLink = document.createElement("a");

            billLink.className = "btn btn-outline btn-sm";
            billLink.style.marginTop = "15px";
            billLink.href = "bill.html?id=" + encodeURIComponent(order.order_id);
            billLink.target = "_blank";
            billLink.rel = "noopener";
            billLink.textContent = "View / Print Bill";

            body.appendChild(billLink);

            card.appendChild(summary);
            card.appendChild(body);

            return card;
        }


        // =============================================
        // EVENTS
        // =============================================

        searchInput.addEventListener("input", renderOrders);
        statusFilter.addEventListener("change", renderOrders);
        sortSelect.addEventListener("change", renderOrders);
        paymentFilter.addEventListener("change", renderOrders);
        refreshButton.addEventListener("click", loadAllOrders);

        loadAllOrders();

    })();
    </script>

</body>

</html>
