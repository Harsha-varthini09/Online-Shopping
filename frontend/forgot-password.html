
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Elegance Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .forgot-page {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;

            background:
                linear-gradient(
                    rgba(73, 59, 89, 0.25),
                    rgba(73, 59, 89, 0.25)
                ),
                url('https://images.unsplash.com/photo-1441986300917-64674bd600d8')
                center/cover no-repeat;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .forgot-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .forgot-heading h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .forgot-heading p {
            font-size: 14px;
        }

        .forgot-card .btn {
            width: 100%;
            margin-top: 10px;
        }

        .forgot-links {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .forgot-links a {
            color: var(--rose);
            font-weight: 700;
        }

        #forgot-message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .forgot-card {
                padding: 28px 22px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            Elegance.
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="register.html">Register</a>
            </li>

        </ul>

    </nav>


    <!-- FORGOT PASSWORD SECTION -->

    <section class="forgot-page">

        <div class="forgot-card">

            <div class="forgot-heading">

                <h1>Forgot Password?</h1>

                <p>
                    Don't worry! Enter your registered email
                    address and we will send you a password
                    reset link.
                </p>

            </div>


            <!-- RESET PASSWORD FORM -->

            <form id="forgot-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="reset-button"
                >
                    Send Reset Link
                </button>

                <p id="forgot-message"></p>

            </form>


            <!-- LOGIN LINK -->

            <div class="forgot-links">

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Elegance Store. All Rights Reserved.
        </p>

    </footer>


    <!-- BACKEND JAVASCRIPT FILES -->

    <script src="../Backend/firebase-config.js"></script>

    <script src="../Backend/firestore-api.js"></script>

    <script src="../Backend/auth-api.js"></script>

    <script src="../Backend/utility.js"></script>


    <!-- FORGOT PASSWORD JAVASCRIPT -->

    <script>

        const forgotForm =
            document.getElementById("forgot-form");

        const forgotMessage =
            document.getElementById("forgot-message");

        const resetButton =
            document.getElementById("reset-button");


        forgotForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                forgotMessage.className = "message-error";
                forgotMessage.textContent = "Please enter a valid email address.";
                return;
            }


            resetButton.disabled = true;

            resetButton.textContent = "Sending...";

            forgotMessage.textContent = "";


            try {

                const result = await resetPassword(email);

                forgotMessage.className = "message-success";

                forgotMessage.textContent =
                    "If an account exists for " + email +
                    ", a password reset link has been sent. Please check your inbox (and spam folder).";

            } catch (error) {

                console.error("Password Reset Error:", error);

                forgotMessage.className = "message-error";

                forgotMessage.textContent = getFriendlyAuthError(error);

            }


            resetButton.disabled = false;

            resetButton.textContent = "Send Reset Link";

        });

    </script>

</body>

</html>
