
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Online Shopping</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #FFF9F2;
            color: #4B4352;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .details-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .details-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(73, 59, 89, 0.08);
        }

        .product-image {
            width: 100%;
            min-height: 300px;
            max-height: 420px;
            object-fit: cover;
            border-radius: 12px;
            background: #FFF9F2;
        }

        .product-info h1 {
            color: #493B59;
            margin-top: 0;
        }

        .product-price {
            color: #C77D91;
            font-size: 27px;
            font-weight: bold;
        }

        .product-description {
            line-height: 1.8;
            color: #8C8492;
        }

        .product-stock {
            color: #493B59;
            margin: 15px 0;
        }

        .add-cart-btn {
            background: #B8A4D9;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .add-cart-btn:hover {
            background: #9279B8;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #9279B8;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .qty-row label {
            font-weight: bold;
            color: #493B59;
        }

        .qty-input {
            width: 80px;
            padding: 10px;
            border: 1px solid #EAE1ED;
            border-radius: 8px;
        }

        .product-category-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8C8492;
        }

        .add-cart-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .details-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Elegance.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="my-orders.html">My Orders</a></li>
            <li><a href="login.html" id="auth-link">Login</a></li>
        </ul>
    </nav>

    <main class="details-container">

        <a href="products.html" class="back-btn">
            ← Back to Products
        </a>

        <div id="product-details">

            <p>Loading product details...</p>

        </div>

        <p id="product-message" class="message"></p>

    </main>

    <!-- BACKEND FILES -->
    <script src="../Backend/firebase-config.js"></script>
    <script src="../Backend/firestore-api.js"></script>
    <script src="../Backend/utility.js"></script>
    <script src="../Backend/product-api.js"></script>
    <script src="../Backend/category-api.js"></script>
    <script src="../Backend/cart-api.js"></script>
    <script src="js/product-image.js"></script>

    <script>

        // GET LOGGED-IN USER
        const userId =
            sessionStorage.getItem("firebaseUserId");

        const token =
            sessionStorage.getItem("firebaseIdToken");


        // GET PRODUCT ID FROM URL
        const urlParams =
            new URLSearchParams(window.location.search);

        const productId =
            urlParams.get("id");


        // LOAD PRODUCT DETAILS
        async function loadProductDetails() {

            const container =
                document.getElementById("product-details");

            if (!productId) {

                container.textContent =
                    "Product ID is missing.";

                return;

            }

            try {

                // GET PRODUCT FROM FIREBASE
                const response =
                    await getProductById(productId);

                const product =
                    convertFromFirestoreDocument(response);

                // STORE DOCUMENT ID
                product.id = productId;

                displayProductDetails(product);

            } catch (error) {

                console.error(
                    "Product Details Error:",
                    error
                );

                container.textContent =
                    "Unable to load product details.";

            }

        }


        // DISPLAY PRODUCT
        function displayProductDetails(product) {

            const container =
                document.getElementById("product-details");

            container.innerHTML = "";

            const card =
                document.createElement("div");

            card.className = "details-card";

            // PRODUCT IMAGE
            const image =
                document.createElement("img");

            image.className = "product-image";

            setProductImage(image, product, "");

            image.alt = product.title || "Product";

            // PRODUCT INFORMATION
            const info =
                document.createElement("div");

            info.className = "product-info";

            const title =
                document.createElement("h1");

            title.textContent =
                product.title || "Product Name";

            const price =
                document.createElement("p");

            price.className = "product-price";

            price.textContent =
                "₹" + Number(product.price || 0).toFixed(2);

            const description =
                document.createElement("p");

            description.className = "product-description";

            description.textContent =
                product.description ||
                "No product description available.";

            const stock =
                document.createElement("p");

            stock.className = "product-stock";

            const stockCount = Number(product.qty || 0);

            stock.textContent = stockCount > 0
                ? "In stock: " + stockCount + (stockCount < 15 ? " (only a few left!)" : "")
                : "Out of stock";

            // CATEGORY NAME (BEST-EFFORT)

            const categoryLabel = document.createElement("p");

            categoryLabel.className = "product-category-label";

            if (product.cat_id) {
                getCategories().then(function (response) {
                    const match = (response.documents || []).find(function (document) {
                        return document.name.split("/").pop() === product.cat_id;
                    });
                    if (match) {
                        const category = convertFromFirestoreDocument(match);
                        categoryLabel.textContent = category.name || category.categoryName || "";
                    }
                }).catch(function () {});
            }

            // QUANTITY SELECTOR

            const qtyRow = document.createElement("div");

            qtyRow.className = "qty-row";

            const qtyLabel = document.createElement("label");

            qtyLabel.htmlFor = "qty-input";

            qtyLabel.textContent = "Quantity";

            const qtyInput = document.createElement("input");

            qtyInput.type = "number";
            qtyInput.id = "qty-input";
            qtyInput.className = "qty-input";
            qtyInput.min = 1;
            qtyInput.max = Math.max(1, stockCount);
            qtyInput.value = 1;
            qtyInput.disabled = stockCount <= 0 || product.status !== "active";

            qtyRow.appendChild(qtyLabel);
            qtyRow.appendChild(qtyInput);

            const addButton =
                document.createElement("button");

            addButton.className = "add-cart-btn";

            addButton.textContent = "Add to Cart";

            addButton.disabled = stockCount <= 0 || product.status !== "active";

            if (addButton.disabled) {
                addButton.textContent = product.status !== "active" ? "Unavailable" : "Out of Stock";
            }

            addButton.onclick = function () {

                addProductToCart(product, addButton, qtyInput.value);

            };

            info.appendChild(categoryLabel);
            info.appendChild(title);
            info.appendChild(price);
            info.appendChild(description);
            info.appendChild(stock);
            info.appendChild(qtyRow);
            info.appendChild(addButton);

            card.appendChild(image);
            card.appendChild(info);

            container.appendChild(card);

        }


        // ADD PRODUCT TO CART
        async function addProductToCart(product, button, quantity) {

            const message =
                document.getElementById("product-message");

            if (!userId || !token) {

                window.location.href = "login.html";

                return;

            }

            if (
                product.status &&
                product.status !== "active"
            ) {

                message.textContent =
                    "This product is currently unavailable.";

                return;

            }

            if (Number(product.qty) <= 0) {

                message.textContent =
                    "This product is out of stock.";

                return;

            }

            quantity = Number(quantity);

            if (!Number.isInteger(quantity) || quantity < 1) {

                message.textContent = "Please choose a quantity of at least 1.";

                return;
            }

            if (quantity > Number(product.qty)) {

                message.textContent = "Only " + Number(product.qty) + " in stock.";

                return;
            }

            try {

                button.disabled = true;

                button.textContent = "Adding...";

                await addToCart(userId, product, quantity);

                message.textContent =
                    quantity + " × " + product.title + " added to your cart.";

                button.textContent = "Add More";

            } catch (error) {

                console.error("Add to Cart Error:", error);

                message.textContent =
                    error.message || "Unable to add product to cart.";

                button.textContent = "Add to Cart";

            } finally {

                button.disabled = false;
            }

        }


        // START
        loadProductDetails();

    </script>

    <script src="js/auth-navigation.js"></script>

</body>

</html>
